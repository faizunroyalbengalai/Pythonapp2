<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>pythonapp1</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 2rem;
    }

    .card {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .project-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-icon svg {
      width: 36px;
      height: 36px;
      fill: #ffffff;
    }

    .project-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #e6edf3;
      text-align: center;
    }

    .project-name span {
      color: #388bfd;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #30363d;
    }

    .repo-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #8b949e;
    }

    .repo-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 0.85rem 1.2rem;
      width: 100%;
      transition: border-color 0.2s, background 0.2s;
      cursor: pointer;
      text-decoration: none;
    }

    .repo-link:hover {
      border-color: #388bfd;
      background: #161b22;
    }

    .repo-link svg {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      fill: #8b949e;
    }

    .repo-name {
      font-size: 1rem;
      font-weight: 600;
      color: #388bfd;
      letter-spacing: 0.01em;
    }

    .repo-arrow {
      margin-left: auto;
      fill: #8b949e !important;
      width: 16px !important;
      height: 16px !important;
    }

    .description {
      font-size: 0.92rem;
      color: #8b949e;
      text-align: center;
      line-height: 1.6;
    }

    footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.82rem;
      color: #8b949e;
      letter-spacing: 0.02em;
      padding-bottom: 2rem;
    }

    footer strong {
      color: #388bfd;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .project-name {
        font-size: 1.7rem;
      }

      .card {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="card">

      <div class="project-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10

      </div>

  </div>

</body>
</html>
